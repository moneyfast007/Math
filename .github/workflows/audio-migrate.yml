# One time: moves the audio clips from the static assets (public/audio/, over
# Cloudflare's file limit) to the R2 bucket the Worker serves /audio/ from, and
# the manifest to audio/manifest.json (with each clip's size). Manual only.
name: Audio to R2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Upload every clip to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp public/audio "s3://plusi-audio/audio/" --recursive --only-show-errors \
            --exclude "*" --include "*.mp3" \
            --endpoint-url "https://${{ vars.CF_ACCOUNT_ID || '6e361a6ea0adc5dde636c123d59a4ba0' }}.r2.cloudflarestorage.com" \
            --content-type audio/mpeg --cache-control "public, max-age=86400"
          echo "uploaded $(ls public/audio/*.mp3 | wc -l) clips"
      - name: Move the manifest, with sizes; remove the clips from the repository
        run: |
          mkdir -p audio
          python3 - <<'PY'
          import json, os
          m = json.load(open('public/audio/manifest.json'))
          for cid, c in m['clips'].items():
              f = f'public/audio/{cid}.mp3'
              if os.path.exists(f):
                  c['bytes'] = os.path.getsize(f)
          json.dump(m, open('audio/manifest.json', 'w'), ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q public/audio/*.mp3 public/audio/manifest.json
          git add audio/manifest.json
          git commit -m "audio: the clips move to R2; the manifest to audio/manifest.json"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Check that the live site serves a clip from R2 (after the deploy)
        run: |
          sleep 300
          ID=$(python3 -c "import json;print(next(iter(json.load(open('audio/manifest.json'))['clips'])))")
          {
            echo "clip $ID"
            curl -s -o /dev/null -w "GET %{http_code} %{content_type} %{size_download} bytes\n" "https://math.assafkutai.workers.dev/audio/$ID.mp3"
            curl -s -o /dev/null -H "Range: bytes=0-1" -w "RANGE %{http_code} %{size_download} bytes\n" "https://math.assafkutai.workers.dev/audio/$ID.mp3"
          } | tee check.txt
          git fetch origin tts-log || true
          git checkout -B tts-log
          git rm -rq --cached . || true
          git add -f check.txt
          git commit -m "audio R2 check ${{ github.run_id }}" || true
          git push --force origin tts-log
