# Generates the app's audio bank: records new and changed clips, trims them,
# uploads them to the R2 bucket the Worker serves /audio/ from, and commits
# audio/manifest.json to the branch it runs on.
# Manual only. Idempotent: only clips whose text changed are regenerated.
name: TTS build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would be generated'
        required: false
        default: 'false'
      max_minutes:
        description: 'Stop starting new clips after this many minutes (rerun to continue)'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: tts-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Generate
        run: |
          DRY="${{ inputs.dry_run }}"
          set -o pipefail
          if [ "$DRY" = "true" ]; then npm run tts:build -- --dry-run 2>&1 | tee tts-build.log; else npm run tts:build -- --max-minutes "${{ inputs.max_minutes }}" 2>&1 | tee tts-build.log; fi
      - name: Trim the silence at both ends of each clip
        if: always() && inputs.dry_run != 'true'
        run: |
          set -o pipefail
          npm run tts:trim -- --max-minutes 25 2>&1 | tee -a tts-build.log
      - name: Upload the new clips to R2
        # Also after a failure: what was recorded before it is kept, and the next run goes on.
        if: always() && inputs.dry_run != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ ! -d audio/clips ] || [ -z "$(ls -A audio/clips)" ]; then echo "no new clips"; exit 0; fi
          aws s3 cp audio/clips "s3://plusi-audio/audio/" --recursive --only-show-errors \
            --endpoint-url "https://${{ vars.CF_ACCOUNT_ID || '6e361a6ea0adc5dde636c123d59a4ba0' }}.r2.cloudflarestorage.com" \
            --content-type audio/mpeg --cache-control "public, max-age=86400"
          echo "uploaded $(ls audio/clips | wc -l) clips"
      - name: Commit the manifest
        if: always() && inputs.dry_run != 'true'
        run: |
          rm -f gha-creds-*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/manifest.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "audio: the bank grows (Gemini 3.1 Flash, Leda, quick pace)"
          BRANCH="${{ github.ref_name }}"
          # Another workflow may have pushed meanwhile: rebase and retry.
          for i in 1 2 3; do git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break; sleep 5; done
      - name: Publish the log to the tts-log branch
        if: always()
        run: |
          rm -f gha-creds-*.json
          mkdir -p /tmp/ttslog && cp tts-build.log /tmp/ttslog/ 2>/dev/null || echo "no log" > /tmp/ttslog/tts-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B tts-log
          git rm -rq --cached . || true
          cp /tmp/ttslog/tts-build.log tts-build.log
          git add -f tts-build.log
          git commit -m "tts build log ${{ github.run_id }}" || true
          git push --force origin tts-log
