# Generates the app's full audio bank into public/audio/ and commits it to main.
# Manual only. Idempotent: only clips whose text changed are regenerated.
name: TTS build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would be generated'
        required: false
        default: 'false'
      max_minutes:
        description: 'Stop starting new clips after this many minutes (rerun to continue)'
        required: false
        default: '320'

permissions:
  contents: write

concurrency:
  group: tts-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Generate
        run: |
          DRY="${{ inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then npm run tts:build -- --dry-run; else npm run tts:build -- --max-minutes "${{ inputs.max_minutes }}"; fi
      - name: Commit the audio bank
        # Also after a failure: what was recorded before it is kept, and the next run goes on.
        if: always() && inputs.dry_run != 'true'
        run: |
          rm -f gha-creds-*.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "audio: regenerate the bank (Gemini 3.1 Flash, Leda, quick pace)"
          git pull --rebase origin main
          # Another workflow may have pushed meanwhile: rebase and retry.
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
