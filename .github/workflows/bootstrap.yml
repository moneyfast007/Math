# Manual helper. Installs on a machine with registry access, formats with
# Prettier, runs the checks, and commits the lockfile, the formatting and a
# plain-text report (.ci/report.txt) back to main, so results can be read
# without access to the Actions log storage. Safe to run any time.
name: Bootstrap and report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write .
      - name: Run checks and write report
        run: |
          mkdir -p .ci
          {
            echo "## typecheck"; npm run typecheck 2>&1 || echo "TYPECHECK FAILED"
            echo; echo "## lint"; npm run lint 2>&1 || echo "LINT FAILED"
            echo; echo "## unit tests"; npm run test 2>&1 || echo "TESTS FAILED"
            echo; echo "## build"; npm run build 2>&1 || echo "BUILD FAILED"
          } > .ci/report.txt
          tail -c 4000 .ci/report.txt
      - name: Playwright
        run: |
          npx playwright install --with-deps webkit chromium >/dev/null 2>&1 || true
          { echo; echo "## e2e"; npm run test:e2e 2>&1 || echo "E2E FAILED"; } >> .ci/report.txt
          tail -c 3000 .ci/report.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f .ci/report.txt
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: bootstrap report"
          git push
