# Manual helper. Installs on a machine with registry access, formats with
# Prettier, runs the checks, and commits the lockfile, the formatting and a
# plain-text report (.ci/report.txt) back to main, so results can be read
# without access to the Actions log storage. Safe to run any time.
name: Bootstrap and report

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Format
        run: |
          mkdir -p .ci
          # A file Prettier can't parse is reported, not fatal: the report says which.
          npx prettier --write . > .ci/prettier.txt 2>&1 || { echo "PRETTIER FAILED"; grep -iE "error|\[error\]" .ci/prettier.txt | head -20; } >> .ci/prettier-errors.txt
      - name: Run checks and write report
        run: |
          mkdir -p .ci
          {
            echo "## format"; cat .ci/prettier-errors.txt 2>/dev/null || echo "ok"
            echo; echo "## typecheck"; npm run typecheck 2>&1 || echo "TYPECHECK FAILED"
            echo; echo "## lint"; npm run lint 2>&1 || echo "LINT FAILED"
            echo; echo "## unit tests"; npm run test 2>&1 || echo "TESTS FAILED"
            echo; echo "## build"; npm run build 2>&1 || echo "BUILD FAILED"
            echo; echo "## audio bank (dry run: what would be generated, and the cost)"
            npm run tts:build -- --dry-run 2>&1 | tail -40 || echo "TTS DRY RUN FAILED"
          } > .ci/report.txt
          tail -c 4000 .ci/report.txt
      - name: Playwright
        run: |
          npx playwright install --with-deps webkit chromium >/dev/null 2>&1 || true
          { echo; echo "## e2e"; npm run test:e2e 2>&1 || echo "E2E FAILED"; } >> .ci/report.txt
          # Screens for a visual review (not a test; committed as images).
          rm -rf .ci/screens && mkdir -p .ci/screens
          SCREENSHOTS=1 npx playwright test tests/e2e/screenshots tests/e2e/sync tests/e2e/mobile --project=ipad --retries=0 > .ci/screens/log.txt 2>&1 || echo "SCREENSHOTS FAILED" >> .ci/report.txt
          tail -c 3000 .ci/report.txt
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git status --short | head -50
            git add -A
            git add -f .ci/report.txt
            git add -f .ci/screens || true
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "chore: bootstrap report"
            # Another workflow (the audio build) may have pushed meanwhile: rebase and retry.
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
            # Bot pushes don't trigger CI; a dispatch does, so the formatted commit gets its own run.
            gh workflow run ci.yml --ref main || true
          } 2>&1 | tee commit.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # Action logs are not readable from everywhere; an issue is.
            { echo '```'; tail -c 6000 commit.log; echo '```'; } > body.md
            gh issue create --title "bootstrap: commit step failed (run ${{ github.run_id }})" --body-file body.md || true
            exit "$status"
          fi
