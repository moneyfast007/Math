# Manual helper: copies a few clips out of the R2 bucket onto the audio-fetch
# branch, so they can be listened to away from the site (the site serves them
# at /audio/<id>.mp3, but a listening page elsewhere cannot embed that).
name: Audio fetch

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Clip ids (16 hex each), comma separated'
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -e
          mkdir -p fetched
          IFS=',' read -ra IDS <<< "${{ inputs.ids }}"
          for id in "${IDS[@]}"; do
            id="$(echo "$id" | tr -d ' ')"
            [[ "$id" =~ ^[0-9a-f]{16}$ ]] || { echo "bad id: $id"; continue; }
            aws s3 cp "s3://plusi-audio/audio/$id.mp3" "fetched/$id.mp3" --only-show-errors \
              --endpoint-url "https://${{ vars.CF_ACCOUNT_ID || '6e361a6ea0adc5dde636c123d59a4ba0' }}.r2.cloudflarestorage.com" || echo "missing: $id"
          done
          ls -la fetched
      - name: Publish to the audio-fetch branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan audio-fetch
          git rm -rfq --cached . >/dev/null
          git add -f fetched
          git commit -qm "audio fetch"
          git push --force origin audio-fetch
