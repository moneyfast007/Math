# Manual: trims the silence at both ends of the clips already in the bucket
# that were never trimmed (the recording runs before ffmpeg was installed on
# the runner), and uploads them again. Each run does what fits in its time;
# rerun until "0 clips to trim".
name: Audio trim

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Time budget for fetching and trimming (the upload comes after it)'
        required: false
        default: '150'

permissions:
  contents: write

concurrency:
  group: tts-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Fetch and trim
        run: |
          set -o pipefail
          command -v ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          npm run tts:trim -- --fetch --copy-to audio/trimmed --max-minutes "${{ inputs.max_minutes }}" 2>&1 | tee audio-trim.log
      - name: Upload the trimmed clips to R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ ! -d audio/trimmed ] || [ -z "$(ls -A audio/trimmed)" ]; then echo "nothing trimmed"; exit 0; fi
          aws s3 cp audio/trimmed "s3://plusi-audio/audio/" --recursive --only-show-errors \
            --endpoint-url "https://${{ vars.CF_ACCOUNT_ID || '6e361a6ea0adc5dde636c123d59a4ba0' }}.r2.cloudflarestorage.com" \
            --content-type audio/mpeg --cache-control "public, max-age=86400"
          echo "uploaded $(ls audio/trimmed | wc -l) clips"
      - name: Commit the manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/manifest.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "audio: clips trimmed"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3; do git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break; sleep 5; done
